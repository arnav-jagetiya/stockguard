# ==============================================================================
# STOCKGUARD — Prometheus Scraper Configuration
# ==============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/alerts.yml"

scrape_configs:
  - job_name: "stockguard"
    metrics_path: "/actuator/prometheus"
    scrape_interval: 15s
    basic_auth:
      username: "stockguard-prometheus"
      password: "${PROMETHEUS_SCRAPER_SECRET:-dev-scrape-pass}"
    static_configs:
      - targets: ["stockguard-app:8081"]
