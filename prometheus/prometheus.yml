global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "stockguard"
    metrics_path: "/actuator/prometheus"
    scrape_interval: 15s
    basic_auth:
      username: "stockguard-prometheus"
      password: "dev-scrape-pass"
    static_configs:
      - targets: ["stockguard-app:8081"]
