spring:
  application:
    name: stockguard
  profiles:
    default: dev

  datasource:
    # Runtime Application Connection Pool (Role: stockguard_app)
    # In production, explicit environment variables (SPRING_DATASOURCE_URL,
    # SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD) must be provided.
    # Fallback development values are strictly defined in the 'dev' profile (application-dev.yml).
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: StockGuardHikariPool
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      connection-timeout: ${DB_POOL_TIMEOUT_MS:30000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          lob:
            non_contextual_creation: true

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    # Migration Engine Connection (Role: stockguard_owner)
    # In production, explicit FLYWAY_USER and FLYWAY_PASSWORD must be provided.
    url: ${FLYWAY_URL:${spring.datasource.url}}
    user: ${FLYWAY_USER:${FLYWAY_USERNAME:}}
    password: ${FLYWAY_PASSWORD:}

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: ${MANAGEMENT_HEALTH_SHOW_DETAILS:when-authorized}
      probes:
        enabled: true
    prometheus:
      enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

stockguard:
  monitoring:
    scraper-username: ${STOCKGUARD_MONITORING_SCRAPER_USERNAME:stockguard-prometheus}
    scraper-password: ${STOCKGUARD_MONITORING_SCRAPER_PASSWORD:dev-scrape-pass}
  security:
    jwt:
      active-key:
        id: ${STOCKGUARD_JWT_ACTIVE_KEY_ID:sg-2026-v1}
        secret: ${STOCKGUARD_JWT_ACTIVE_SECRET:}
      retiring-keys: {}
      access-token-expiration-minutes: 15
      issuer: ${STOCKGUARD_JWT_ISSUER:stockguard-platform}
      audience: ${STOCKGUARD_JWT_AUDIENCE:stockguard-api}
    cookie:
      name: ${STOCKGUARD_COOKIE_NAME:__Secure-stockguard_refresh}
      path: "/api/auth"
      secure: ${STOCKGUARD_COOKIE_SECURE:true}
      http-only: true
      same-site: ${STOCKGUARD_COOKIE_SAME_SITE:Strict}
    rate-limit:
      login-permits-per-minute: 5
      refresh-permits-per-minute: 20
    cors:
      allowed-origins:
        - "http://localhost:5173"
    bootstrap:
      enabled: ${STOCKGUARD_BOOTSTRAP_ADMIN_ENABLED:false}
      admin-email: ${STOCKGUARD_BOOTSTRAP_ADMIN_EMAIL:}
      admin-password: ${STOCKGUARD_BOOTSTRAP_ADMIN_PASSWORD:}
      admin-full-name: ${STOCKGUARD_BOOTSTRAP_ADMIN_FULL_NAME:}
      org-name: ${STOCKGUARD_BOOTSTRAP_ORG_NAME:Primary Organization}
      allow-password-reset: ${STOCKGUARD_BOOTSTRAP_ALLOW_PASSWORD_RESET:false}
    registration:
      enabled: ${STOCKGUARD_REGISTRATION_ENABLED:false}
    public-demo:
      enabled: ${STOCKGUARD_PUBLIC_DEMO_ENABLED:true}
      demo-email: ${STOCKGUARD_PUBLIC_DEMO_EMAIL:demo.visitor@stockguard.dev}
      demo-org-name: ${STOCKGUARD_PUBLIC_DEMO_ORG_NAME:Acme Industrial Supply Pvt. Ltd.}
  demo:
    seed-enabled: ${STOCKGUARD_DEMO_SEED_ENABLED:false}
    admin-email: ${STOCKGUARD_DEMO_ADMIN_EMAIL:acme-admin@stockguard.dev}
    admin-password: ${STOCKGUARD_DEMO_ADMIN_PASSWORD:RedactedAdminSecret2026!}
    admin-full-name: ${STOCKGUARD_DEMO_ADMIN_FULL_NAME:Aarav Mehta}
    org-name: ${STOCKGUARD_DEMO_ORG_NAME:Acme Industrial Supply Pvt. Ltd.}
  reservation:
    default-ttl-minutes: ${STOCKGUARD_RESERVATION_DEFAULT_TTL_MINUTES:15}
    expiration:
      enabled: ${STOCKGUARD_RESERVATION_EXPIRATION_ENABLED:true}
      fixed-delay-ms: ${STOCKGUARD_RESERVATION_EXPIRATION_FIXED_DELAY_MS:30000}
      initial-delay-ms: ${STOCKGUARD_RESERVATION_EXPIRATION_INITIAL_DELAY_MS:10000}
      batch-size: ${STOCKGUARD_RESERVATION_EXPIRATION_BATCH_SIZE:50}
  reconciliation:
    scheduled:
      enabled: ${STOCKGUARD_RECONCILIATION_SCHEDULED_ENABLED:true}
      cron: ${STOCKGUARD_RECONCILIATION_SCHEDULED_CRON:0 0 2 * * *}
      initial-delay-ms: ${STOCKGUARD_RECONCILIATION_SCHEDULED_INITIAL_DELAY_MS:30000}
      max-duration-seconds: ${STOCKGUARD_RECONCILIATION_SCHEDULED_MAX_DURATION_SECONDS:1800}
      query-timeout-seconds: ${STOCKGUARD_RECONCILIATION_SCHEDULED_QUERY_TIMEOUT_SECONDS:60}
      tenant-batch-size: ${STOCKGUARD_RECONCILIATION_SCHEDULED_TENANT_BATCH_SIZE:100}
