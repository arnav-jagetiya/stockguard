openapi: 3.1.0
info:
  title: STOCKGUARD Platform API
  description: >
    Multi-tenant, double-entry inventory protection and audit retrieval engine.
    Enforces strict tenant isolation, immutable append-only audit logging,
    and fine-grained role-based access control.
  version: 1.0.0

servers:
  - url: /api
    description: Production & Local Application API

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Stateless RS256/EdDSA JWT access token issued at /api/auth/login or /api/auth/refresh.
        Must be supplied in the standard HTTP 'Authorization: Bearer <token>' header on all
        organization-scoped endpoints.
    RefreshCookieAuth:
      type: apiKey
      in: cookie
      name: stockguard_refresh
      description: >
        Opaque, single-use refresh token transmitted exclusively via HttpOnly Secure
        SameSite=Strict cookie for session lifecycle operations (/api/auth/refresh, /api/auth/logout).

  parameters:
    OrganizationHeader:
      name: X-Organization-Id
      in: header
      required: true
      description: >
        Mandatory authoritative tenant organization UUID context. Every request to an
        organization-scoped endpoint must supply this header. Cross-tenant access is rejected with 403.
      schema:
        type: string
        format: uuid
      example: "9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d"

    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      description: >
        Mandatory UUID idempotency key required on all mutating POST, PUT, DELETE operations.
        Keys are scoped by (organization_id, principal_id, operation_scope, idempotency_key)
        with a 7-day retention period.
      schema:
        type: string
        format: uuid
      example: "a8098c1a-f86e-11da-bd1a-00112444be1e"

    CsrfTokenHeader:
      name: X-StockGuard-CSRF
      in: header
      required: false
      description: >
        Anti-CSRF custom header assertion required on cookie-authenticated state-changing
        endpoints (/api/auth/refresh, /api/auth/logout). Must have value '1' or 'true'.
      schema:
        type: string
        enum: ["1", "true"]
      example: "1"

  schemas:
    AuditLogResponse:
      type: object
      required:
        - id
        - organizationId
        - action
        - entityType
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          description: Unique audit log entry identifier
        organizationId:
          type: string
          format: uuid
          description: Tenant organization UUID to which this audit entry belongs
        actorUserId:
          type: string
          format: uuid
          nullable: true
          description: User ID of the authenticated actor (null for automated background system tasks)
        action:
          type: string
          description: Canonical audit action name
          example: "STOCK_ADJUSTED"
        entityType:
          type: string
          description: Canonical entity type
          example: "INVENTORY_BALANCE"
        entityId:
          type: string
          format: uuid
          nullable: true
          description: Primary key UUID of the impacted domain entity
        beforeState:
          type: object
          description: Sanitized snapshot of the domain entity state before mutation
          additionalProperties: true
        afterState:
          type: object
          description: Sanitized snapshot of the domain entity state after mutation
          additionalProperties: true
        metadata:
          type: object
          description: Purpose-specific operational metadata and event details
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
          description: ISO-8601 timestamp of record creation in PostgreSQL

    AuditLogPageResponse:
      type: object
      required:
        - content
        - page
        - size
        - totalElements
        - totalPages
        - first
        - last
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/AuditLogResponse'
        page:
          type: integer
          description: 0-based page index
          example: 0
        size:
          type: integer
          description: Number of elements per page
          example: 20
        totalElements:
          type: integer
          format: int64
          description: Total matching audit records count across all pages
          example: 42
        totalPages:
          type: integer
          description: Total number of pages available
          example: 3
        first:
          type: boolean
          description: True if this is the first page
          example: true
        last:
          type: boolean
          description: True if this is the final page
          example: false

    ErrorResponse:
      type: object
      required:
        - timestamp
        - status
        - error
        - message
        - path
      properties:
        timestamp:
          type: string
          format: date-time
          example: "2026-11-14T19:30:00Z"
        status:
          type: integer
          example: 400
        error:
          type: string
          example: "Bad Request"
        message:
          type: string
          example: "Missing mandatory organization header 'X-Organization-Id'"
        path:
          type: string
          example: "/api/audit-logs"

paths:
  /audit-logs:
    get:
      summary: Retrieve paginated tenant audit logs
      description: >
        Retrieves paginated, deterministic audit records strictly scoped to the caller's tenant organization.
        Requires authenticated principal with 'audit:view' permission (held by ADMIN and MANAGER roles).
        Rejects OPERATOR and VIEWER roles with 403 Forbidden.
        Sort order is deterministically newest-first (ORDER BY created_at DESC, id DESC).
      operationId: getAuditLogs
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrganizationHeader'
        - name: action
          in: query
          required: false
          description: Filter by canonical audit action name (e.g. STOCK_ADJUSTED, ORDER_CREATED)
          schema:
            type: string
          example: "STOCK_ADJUSTED"
        - name: entityType
          in: query
          required: false
          description: Filter by canonical entity type (e.g. INVENTORY_BALANCE, ORDER, AUTH_SESSION)
          schema:
            type: string
          example: "INVENTORY_BALANCE"
        - name: entityId
          in: query
          required: false
          description: Filter by domain entity UUID
          schema:
            type: string
            format: uuid
        - name: actorUserId
          in: query
          required: false
          description: Filter by actor user UUID
          schema:
            type: string
            format: uuid
        - name: startDate
          in: query
          required: false
          description: Start of date range (ISO-8601 timestamp)
          schema:
            type: string
            format: date-time
        - name: fromDate
          in: query
          required: false
          description: Alias for startDate
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          required: false
          description: End of date range (ISO-8601 timestamp)
          schema:
            type: string
            format: date-time
        - name: toDate
          in: query
          required: false
          description: Alias for endDate
          schema:
            type: string
            format: date-time
        - name: page
          in: query
          required: false
          description: 0-based page index (must be >= 0)
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          description: Number of items per page (must be between 1 and 100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Paginated audit log records successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogPageResponse'
        '400':
          description: Invalid request parameters (missing X-Organization-Id, invalid UUID, startDate > endDate, page < 0, size not in 1..100)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthenticated request (missing or invalid Bearer JWT)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (caller lacks 'audit:view' permission, or holds no active membership in target organization)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
